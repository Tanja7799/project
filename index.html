
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure Care — каталог</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <a href="#" class="logo">Pure Care</a>

        <nav>
            <a href="#products">Каталог</a>
            <a href="#footer">Контакти</a>
        </nav>
    </header>

    <main class="container">

        <section class="intro">
            <h1>Догляд для тебе</h1>
            <p>Натуральні продукти для щоденного догляду</p>
        </section>

        <section class="products" id="products">

            <article class="product-card">
                <img
                    src="https://placehold.co/400x300/E4EDE3/333333?text=Face+Cream"
                    alt="Крем для обличчя"
                >
                <h2>Крем для обличчя</h2>
                <p class="price">320 грн</p>
                <button type="button">Купити</button>
            </article>

            <article class="product-card">
                <img
                    src="https://placehold.co/400x300/F1E6D7/333333?text=Natural+Soap"
                    alt="Натуральне мило"
                >
                <h2>Натуральне мило</h2>
                <p class="price">150 грн</p>
                <button type="button">Купити</button>
            </article>

            <article class="product-card">
                <img
                    src="https://placehold.co/400x300/E8E4F0/333333?text=Body+Oil"
                    alt="Олія для тіла"
                >
                <h2>Олія для тіла</h2>
                <p class="price">280 грн</p>
                <button type="button">Купити</button>
            </article>

        </section>
    </main>

    <footer class="footer" id="footer">
        <p>© Pure Care — натуральний догляд</p>
    </footer>

</body>
</html>
